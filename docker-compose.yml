version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: overwatch-postgres
    environment:
      POSTGRES_USER: overwatch
      POSTGRES_PASSWORD: overwatch_secure_pass
      POSTGRES_DB: overwatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overwatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kenya-overwatch-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: overwatch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kenya-overwatch-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: overwatch-backend
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://overwatch:${POSTGRES_PASSWORD}@postgres:5432/overwatch_db
      REDIS_URL: redis://redis:6379/0
      OVERWATCH_ENV: production
      OVERWATCH_DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      API_SECRET_KEY: ${API_SECRET_KEY}
      API_KEYS: ${API_KEYS}
      INITIAL_SETUP_PASSWORD: ${INITIAL_SETUP_PASSWORD}
      ENABLE_SWAGGER: "true"
      LOG_LEVEL: info
      SMS_ENABLED: "false"
      EMAIL_ENABLED: "false"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./data:/app/data
      - evidence_storage:/app/static/evidence_attachments
    restart: unless-stopped
    networks:
      - kenya-overwatch-network

  # Frontend - Control Center
  control-center:
    build:
      context: ./frontend/control_center
      dockerfile: Dockerfile
    container_name: overwatch-control-center
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8001
      NEXT_PUBLIC_WS_URL: ws://backend:8001
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kenya-overwatch-network

  # Frontend - TaifaGuard
  taifa-guard:
    build:
      context: ./frontend/taifa_guard
      dockerfile: Dockerfile
    container_name: overwatch-taifa-guard
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8001
      NEXT_PUBLIC_WS_URL: ws://backend:8001
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kenya-overwatch-network

  # Frontend - Ulinzi 112
  ulinzi-112:
    build:
      context: ./frontend/ulinnzi_112
      dockerfile: Dockerfile
    container_name: overwatch-ulinzi-112
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8001
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kenya-overwatch-network

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: overwatch-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      control-center:
        condition: service_healthy
      taifa-guard:
        condition: service_healthy
      ulinzi-112:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kenya-overwatch-network

volumes:
  postgres_data:
  redis_data:
  evidence_storage:

networks:
  kenya-overwatch-network:
    driver: bridge
