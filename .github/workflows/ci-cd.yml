name: Kenya Overwatch CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # Code Quality Check
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linting tools
        run: |
          pip install ruff black isort
      
      - name: Run Ruff linter
        run: |
          ruff check ai/ security/ backend/ ops/
      
      - name: Check code formatting
        run: |
          black --check ai/ security/ backend/ ops/
      
      - name: Check import sorting
        run: |
          isort --check ai/ security/ backend/ ops/

  # TypeScript Type Checking
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/control_center/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend/control_center
          npm ci
      
      - name: Run TypeScript type check
        run: |
          cd frontend/control_center
          npx tsc --noEmit

  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements-minimal.txt
      
      - name: Run backend tests
        run: |
          cd backend
          source venv/bin/activate
          python -m pytest tests/ -v --tb=short
      
      - name: Run Alembic migrations check
        run: |
          cd backend
          source venv/bin/activate
          python migrate.py || true

  # Frontend Tests
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/control_center/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend/control_center
          npm ci
      
      - name: Run frontend tests
        run: |
          cd frontend/control_center
          npm test -- --coverage
      
      - name: Build frontend
        run: |
          cd frontend/control_center
          npm run build

  # Security scanning
  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r ai/ security/ backend/ ops/ -f json -o bandit-report.json || true
      
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true
      
      - name: Check for secrets
        run: |
          pip install git-credentials-detector || true
          git clone --depth 1 https://github.com/trufflesecurity/trufflehog.git /tmp/trufflehog || true
          pip install truffleHog || true
          trufflehog filesystem . --json 2>/dev/null || true

  # Container Security Scanning
  container-security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # Build Docker images
  build:
    runs-on: ubuntu-latest
    needs: [code-quality, type-check, backend-test, frontend-test, security, container-security]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: kenya-overwatch-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/control_center
          push: false
          tags: kenya-overwatch-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build taifa-guard image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/taifa_guard
          push: false
          tags: kenya-overwatch-taifa-guard:latest
          cache-from: type=gha
      
      - name: Build taifaroad image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/taifaroad
          push: false
          tags: kenya-overwatch-taifaroad:latest
          cache-from: type=gha

  # Deploy to staging (on develop branch)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # kubectl config use-context staging
          # kubectl apply -f k8s/

  # Deploy to production (on main branch)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # kubectl config use-context production
          # kubectl apply -f k8s/
