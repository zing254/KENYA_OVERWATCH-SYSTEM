name: Deploy to Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kenya-overwatch-backend:${{ github.sha }}

      - name: Build and push control-center image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/control_center
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kenya-overwatch-control-center:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy to Kubernetes
        run: |
          kubectl config use-context ${{ github.event.inputs.environment || 'production' }}
          
          # Update image tags in deployment
          kubectl set image deployment/backend backend=${{ secrets.DOCKER_USERNAME }}/kenya-overwatch-backend:${{ github.sha }}
          kubectl set image deployment/control-center control-center=${{ secrets.DOCKER_USERNAME }}/kenya-overwatch-control-center:${{ github.sha }}
          
          # Wait for rollout
          kubectl rollout status deployment/backend --timeout=300s
          kubectl rollout status deployment/control-center --timeout=300s
          
          # Show deployment status
          kubectl get pods -l app=backend
          kubectl get pods -l app=control-center

      - name: Notify deployment
        if: always()
        run: |
          STATUS="${{ job.status }}"
          MESSAGE="Deployment to ${{ github.event.inputs.environment || 'production' }}: $STATUS"
          echo "::notice title::Deployment $MESSAGE"

  rollback:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Rollback deployment
        run: |
          kubectl rollout undo deployment/backend
          kubectl rollout undo deployment/control-center
          kubectl rollout status deployment/backend --timeout=120s

      - name: Notify failure
        run: |
          echo "::error title::Deployment Failed - Rolling back"