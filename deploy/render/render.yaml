# Kenya Overwatch - Render.com Deployment
# Free tier: Web services spin down after 15 min of inactivity
# Deploy at: https://dashboard.render.com

services:
  # Backend API (Free tier - may spin down)
  - type: web
    name: kenya-overwatch-backend
    runtime: python
    buildCommand: |
      cd backend
      pip install -r requirements-minimal.txt
    startCommand: |
      cd backend
      python -m uvicorn road_safety_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kenya-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OW_DEV_NO_AUTH
        value: "0"
      - key: OVERWATCH_ENV
        value: production
    healthCheckPath: /api/health

  # Control Center Frontend
  - type: web
    name: kenya-overwatch-dashboard
    runtime: node
    buildCommand: |
      cd frontend/control_center
      npm install
      npm run build
    startCommand: |
      cd frontend/control_center
      npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: kenya-overwatch-backend
          property: url
      - key: NODE_ENV
        value: production

  # Citizen Portal
  - type: web
    name: kenya-citizen-portal
    runtime: node
    buildCommand: |
      cd frontend/taifaroad
      npm install
      npm run build
    startCommand: |
      cd frontend/taifaroad
      PORT=3002 npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: kenya-overwatch-backend
          property: url
      - key: PORT
        value: "3002"

  # Responder App
  - type: web
    name: kenya-responder-app
    runtime: node
    buildCommand: |
      cd frontend/taifa_guard
      npm install
      npm run build
    startCommand: |
      cd frontend/taifa_guard
      PORT=3001 npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: kenya-overwatch-backend
          property: url
      - key: PORT
        value: "3001"

# PostgreSQL Database (Free tier: 90 days, 1GB)
databases:
  - name: kenya-db
    databaseName: kenya_overwatch
    user: kenya_user
    plan: free
