version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: kenya_overwatch_dev_postgres
    environment:
      POSTGRES_USER: overwatch
      POSTGRES_PASSWORD: overwatch
      POSTGRES_DB: overwatch
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "overwatch"]
      interval: 5s
      timeout: 5s
      retries: 5
