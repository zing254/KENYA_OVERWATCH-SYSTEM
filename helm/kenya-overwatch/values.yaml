replicaCount: 1

image:
  backend: kenya-overwatch-backend:latest
  controlCenter: kenya-overwatch-control-center:latest
  taifaGuard: kenya-overwatch-taifa-guard:latest
  taifaroad: kenya-overwatch-taifaroad:latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  backend:
    port: 8001
  controlCenter:
    port: 3000
  taifaGuard:
    port: 3000
  taifaroad:
    port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: overwatch.local
      paths:
        - path: /
          pathType: Prefix
          service: control-center
  tls: []
  # - secretName: overwatch-tls
  #   hosts:
  #     - overwatch.local

resources:
  backend:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  frontend:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  postgres:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  redis:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

postgres:
  enabled: true
  image: postgres:15-alpine
  user: overwatch
  password: overwatch_secure_pass
  database: overwatch_db

redis:
  enabled: true
  image: redis:7-alpine

env:
  OVERWATCH_ENV: production
  OVERWATCH_DEBUG: "false"
  DATABASE_URL: postgresql://overwatch:overwatch_secure_pass@postgres:5432/overwatch_db
  REDIS_URL: redis://redis:6379/0
  API_URL: http://backend:8001

secrets:
  JWT_SECRET_KEY: ""
  API_SECRET_KEY: ""
  SENTRY_DSN: ""